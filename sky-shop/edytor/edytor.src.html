<title>Edytor strony Oak&amp;Oats</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@400;500;600&display=swap">
<style>
/* Układ: dwa panele — po lewej lista sekcji z polami, po prawej podgląd na żywo w ramce o szerokości urządzenia.
   Na telefonie przełącznik „Edycja / Podgląd”. */
:root{
  --bg:#f1eee9; --panel:#fbfaf7; --field:#ffffff; --line:#e1dbd2; --fg:#26221e; --mute:#776d63;
  --acc:#6f5443; --accfg:#ffffff; --sel:#c4952f; --danger:#a5463a; --stage:#e6e1d9;
  --ui:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif; --disp:"Cormorant Garamond",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181614; --panel:#211e1b; --field:#2a2622; --line:#3a352f; --fg:#efe9e1; --mute:#a99d90;
  --acc:#d7b096; --accfg:#1c1714; --sel:#e3bb5c; --danger:#e08a7d; --stage:#12100f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181614; --panel:#211e1b; --field:#2a2622; --line:#3a352f; --fg:#efe9e1; --mute:#a99d90;
  --acc:#d7b096; --accfg:#1c1714; --sel:#e3bb5c; --danger:#e08a7d; --stage:#12100f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.brand{font:500 21px/1 var(--disp);letter-spacing:.04em;margin-right:6px;white-space:nowrap}
.brand i{font-style:italic;font-weight:400;color:var(--mute)}
.grp{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.btn{border:1px solid var(--line);background:var(--field);border-radius:7px;padding:7px 11px;line-height:1.1;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn:disabled{opacity:.4;cursor:default}
.grp .btn{border-color:transparent;background:transparent}
.grp .btn[aria-pressed="true"]{background:var(--field);border-color:var(--line);font-weight:600}
.btn--acc{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
.btn--acc:hover{filter:brightness(1.08);border-color:var(--acc)}
.btn--sm{padding:4px 8px;font-size:12px}
.btn--danger{color:var(--danger)}
.sp{flex:1}
.status{font-size:12px;color:var(--mute);white-space:nowrap}
.tabsw{display:none}

.main{display:grid;grid-template-columns:400px 1fr;min-height:0}
.side{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;min-height:0;padding:12px 12px 80px}
.stage{background:var(--stage);min-height:0;overflow:auto;display:grid;justify-items:center;align-items:start;padding:14px}
.frame{width:100%;height:100%;min-height:600px;border:0;background:#fff;box-shadow:0 1px 0 var(--line),0 8px 30px rgba(0,0,0,.12);border-radius:6px;transition:width .25s}
.stage[data-dev="tablet"] .frame{width:820px;max-width:100%}
.stage[data-dev="phone"] .frame{width:390px;max-width:100%}

/* karty sekcji */
.card{border:1px solid var(--line);border-radius:10px;background:var(--field);margin-bottom:8px}
.card.is-sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.card.is-hidden .card__name{opacity:.45;text-decoration:line-through}
.card__head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;cursor:pointer;user-select:none}
.card__name{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card__type{display:block;font-weight:400;font-size:11px;color:var(--mute);letter-spacing:.04em}
.ib{width:28px;height:28px;display:grid;place-items:center;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--mute);font-size:14px}
.ib:hover{border-color:var(--line);color:var(--fg)}
.card__body{padding:4px 12px 14px;border-top:1px solid var(--line);display:grid;gap:12px}
.card:not(.is-open) .card__body{display:none}

.f{display:grid;gap:5px;min-width:0}
.f>label,.f .lbl{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.f input[type=text],.f textarea,.f select,.f input[type=number]{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 9px;min-width:0}
.f textarea{resize:vertical;min-height:70px}
.f .hint{font-size:11.5px;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rng{display:flex;align-items:center;gap:8px}.rng input{flex:1}.rng output{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.grpbox{border:1px dashed var(--line);border-radius:9px;padding:10px;display:grid;gap:12px}
.grpbox>.gt{font:500 17px/1.1 var(--disp)}
.flash{animation:flash 1.2s}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--sel)}100%{box-shadow:0 0 0 0 transparent}}

.list{display:grid;gap:8px}
.li{border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.li__head{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 10px;cursor:pointer}
.li__name{flex:1;min-width:0;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li__body{padding:2px 10px 12px;display:grid;gap:10px}
.li:not(.is-open) .li__body{display:none}
.li__thumb{width:30px;height:30px;border-radius:5px;object-fit:cover;flex:none;background:var(--line)}

/* pole zdjęcia */
.img{display:grid;gap:8px}
.img__crops{display:grid;grid-template-columns:1.45fr 1fr;gap:8px}
.crop{position:relative;border-radius:8px;overflow:hidden;background:var(--line);cursor:crosshair;border:1px solid var(--line)}
.crop img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.crop--d{aspect-ratio:4/3}.crop--m{aspect-ratio:9/16;max-height:170px;justify-self:stretch}
.crop__dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 0 9999px rgba(0,0,0,.08);pointer-events:none}
.crop__tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 6px;border-radius:4px;letter-spacing:.03em}
.crop.is-drop{outline:3px dashed var(--sel);outline-offset:-3px}
.img__btns{display:flex;flex-wrap:wrap;gap:6px}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:220px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.lib button{padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;aspect-ratio:1;background:var(--line)}
.lib button:hover{border-color:var(--sel)}
.lib img{width:100%;height:100%;object-fit:cover;display:block}

/* punkty na zdjęciu */
.pts{position:relative;border-radius:8px;overflow:hidden;cursor:crosshair;border:1px solid var(--line)}
.pts img{width:100%;display:block;pointer-events:none}
.pts__dot{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;color:#222;font:600 12px/24px var(--ui);text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.35);pointer-events:none}
.pts__dot.is-on{background:var(--sel);color:#1b1612}

.add{width:100%;padding:12px;border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--mute);font-weight:600}
.add:hover{border-color:var(--acc);color:var(--fg)}

/* modale */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,12,.45);display:grid;place-items:center;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(860px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg h2{margin:0;font:500 28px/1.1 var(--disp)}
.dlg p{margin:0;color:var(--mute)}
.dlg textarea{width:100%;min-height:260px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--field)}
.dlg__foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.type{text-align:left;border:1px solid var(--line);background:var(--field);border-radius:11px;padding:14px;display:grid;gap:6px}
.type:hover{border-color:var(--acc)}
.type b{font:500 19px/1.1 var(--disp)}
.type span{font-size:12.5px;color:var(--mute)}
.type em{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.files{display:grid;gap:4px;max-height:200px;overflow:auto;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field)}
.files div{display:flex;justify-content:space-between;gap:10px}
.files code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--bg);color:var(--mute);flex:none}
.tag--new{background:var(--sel);color:#1b1612}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--fg)}

.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .tabsw{display:flex}
  .app[data-pane="edit"] .stage{display:none}
  .app[data-pane="view"] .side{display:none}
  .side{border-right:0}
  .stage{padding:8px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app" data-pane="edit">
  <header class="bar">
    <div class="brand">Oak&amp;Oats <i>edytor strony</i></div>
    <div class="grp tabsw" role="group" aria-label="Widok">
      <button class="btn" id="paneEdit" aria-pressed="true">Edycja</button>
      <button class="btn" id="paneView" aria-pressed="false">Podgląd</button>
    </div>
    <button class="btn" id="undo" title="Cofnij (Ctrl+Z)">↶ Cofnij</button>
    <button class="btn" id="redo" title="Ponów (Ctrl+Shift+Z)">↷</button>
    <div class="grp" role="group" aria-label="Urządzenie">
      <button class="btn" data-dev="desktop" aria-pressed="true">Komputer</button>
      <button class="btn hide-sm" data-dev="tablet" aria-pressed="false">Tablet</button>
      <button class="btn" data-dev="phone" aria-pressed="false">Telefon</button>
    </div>
    <span class="sp"></span>
    <span class="status" id="status">Zapisano w przeglądarce</span>
    <button class="btn" id="projBtn">Projekt</button>
    <button class="btn" id="codeBtn">Kod</button>
    <button class="btn btn--acc" id="zipBtn">Eksport do Sky-Shop</button>
  </header>
  <div class="main">
    <aside class="side" id="side" aria-label="Sekcje strony"></aside>
    <section class="stage" id="stage" data-dev="desktop" aria-label="Podgląd strony">
      <iframe class="frame" id="frame" title="Podgląd strony głównej"></iframe>
    </section>
  </div>
</div>
<input type="file" id="fileIn" accept="image/jpeg,image/png,image/webp,image/avif" hidden>
<input type="file" id="projIn" accept="application/json,.json" hidden>

<script>
"use strict";
/* ============================================================
   Dane domyślne: zdjęcia wstrzykiwane przez build-edytor.py
   ============================================================ */
const DEFAULT_IMAGES = /*@@IMAGES@@*/{};

/* ============================================================
   Narzędzia
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rich = s => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
const uid = () => Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const slug = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/ł/g,'l').replace(/Ł/g,'L')
  .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').split('-').slice(0, 4).join('-') || 'zdjecie';
const I = (key, alt, p = [50, 50]) => ({ key, km: '', p, pm: null, alt });
let toastT;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = el('div', { class: 'toast', role: 'status', text: msg });
  document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200);
}

/* ============================================================
   Magazyn zdjęć: key -> {blob, url, w, h}
   ============================================================ */
const IMGS = new Map();
async function addImage(key, blob) {
  const url = URL.createObjectURL(blob);
  let w = 0, h = 0;
  try { const b = await createImageBitmap(blob); w = b.width; h = b.height; b.close(); }
  catch { await new Promise(r => { const i = new Image(); i.onload = () => { w = i.naturalWidth; h = i.naturalHeight; r(); }; i.onerror = r; i.src = url; }); }
  IMGS.set(key, { blob, url, w, h, user: !(key in DEFAULT_IMAGES) });
  return key;
}
const dataToBlob = async d => (await fetch(d)).blob();
async function fileToImage(file) {
  if (!/^image\/(jpeg|png|webp|avif)$/.test(file.type)) throw new Error('Obsługiwane formaty: JPG, PNG, WEBP. Zdjęcia HEIC z iPhone\'a najpierw zapisz jako JPG.');
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close();
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .9));
  const key = 'u' + Date.now().toString(36) + uid();
  await addImage(key, blob); saveUploads(); return key;
}
const imgUrl = k => IMGS.get(k)?.url || '';

/* ============================================================
   Typy sekcji (widgety)
   Każdy typ: label, desc, kind, fields (schemat panelu), make() (dane startowe), css, render(d, c, id)
   ============================================================ */
const LINK_HINT = 'Adres kategorii lub produktu, np. /pl/c/naszyjniki';
const TITLE_HINT = 'Słowo w *gwiazdkach* będzie kursywą.';
const tileText = (c, title, sub, more) =>
  `<span class="oo-tile__text"><span class="oo-tile__title">${c.t(title)}</span>${sub ? `<span class="oo-tile__sub">${c.t(sub)}</span>` : ''}${more ? `<span class="oo-tile__more">${c.e(more)}</span>` : ''}</span>`;
const head = (c, d, link) => (d.eyebrow || d.title || link) ?
  `<div class="oo-head"><div>${d.eyebrow ? `<span class="oo-eyebrow">${c.e(d.eyebrow)}</span>` : ''}${d.title ? `<h2 class="oo-h2">${c.t(d.title)}</h2>` : ''}</div>${link || ''}</div>` : '';
const HEAD_FIELDS = [
  { t: 'text', k: 'eyebrow', label: 'Nadtytuł' },
  { t: 'text', k: 'title', label: 'Tytuł sekcji', hint: TITLE_HINT },
];

const TYPES = {
  heroTiles: {
    label: 'Hero z kafli', kind: 'Pełny ekran', desc: 'Duży kafel z nagłówkiem i dwa mniejsze obok. Na telefonie duży na górze, dwa pod nim.',
    make: () => ({
      h: 100, hm: 86,
      main: { img: I('', ''), eyebrow: 'Nadtytuł', title: 'Nagłówek *strony*', lead: 'Krótki opis.', cta: 'Zobacz', href: '/' },
      side: [{ img: I('', ''), title: 'Kafel *pierwszy*', more: 'Zobacz', href: '/' }, { img: I('', ''), title: 'Kafel *drugi*', more: 'Zobacz', href: '/' }]
    }),
    fields: [
      { t: 'group', k: 'main', label: 'Duży kafel', fields: [
        { t: 'img', k: 'img', label: 'Zdjęcie', mobile: true },
        { t: 'text', k: 'eyebrow', label: 'Nadtytuł' },
        { t: 'text', k: 'title', label: 'Nagłówek H1', hint: TITLE_HINT },
        { t: 'area', k: 'lead', label: 'Opis' },
        { t: 'text', k: 'cta', label: 'Tekst przycisku' },
        { t: 'text', k: 'href', label: 'Link', hint: LINK_HINT } ] },
      { t: 'list', k: 'side', label: 'Małe kafle', min: 2, max: 2, title: it => it.title, item: [
        { t: 'img', k: 'img', label: 'Zdjęcie', mobile: true },
        { t: 'text', k: 'title', label: 'Tytuł', hint: TITLE_HINT },
        { t: 'text', k: 'more', label: 'Podpis linku' },
        { t: 'text', k: 'href', label: 'Link', hint: LINK_HINT } ] },
      { t: 'range', k: 'h', label: 'Wysokość na komputerze', min: 60, max: 100, unit: '% ekranu' },
      { t: 'range', k: 'hm', label: 'Wysokość dużego kafla na telefonie', min: 50, max: 100, unit: '% ekranu' },
    ],
    css: `.oo-hero{display:grid;gap:var(--oo-seam);grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr;min-height:560px;max-height:1000px}
.oo-hero__main{grid-row:1 / span 2}
.oo-hero__main .oo-fill{animation:oo-settle 1.8s cubic-bezier(.2,.7,.2,1) backwards}
.oo-hero__main::after{background:linear-gradient(180deg,rgba(30,26,22,0) 35%,rgba(30,26,22,.72) 100%)}
.oo-hero__main .oo-tile__text{gap:16px;max-width:42rem;padding-bottom:clamp(28px,4.5vw,64px)}
.oo-hero h1{font:500 clamp(2.6rem,5vw,5.2rem)/.98 var(--oo-serif);letter-spacing:-.01em;text-wrap:balance}
.oo-hero__lead{max-width:34em;font-size:clamp(.98rem,1.1vw,1.08rem);opacity:.92}
@keyframes oo-settle{from{transform:scale(1.07)}to{transform:scale(1)}}
@media (max-width:760px){
.oo-hero{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;height:auto!important;min-height:0;max-height:none}
.oo-hero__main{grid-column:1 / span 2;grid-row:auto;min-height:480px}
.oo-hero__main .oo-tile__text{gap:12px}
.oo-hero h1{font-size:clamp(2.4rem,11vw,3.2rem)}
.oo-hero .oo-eyebrow{letter-spacing:.16em}
.oo-hero__side{aspect-ratio:4/5}
.oo-hero__side .oo-tile__title{font-size:1.3rem}
.oo-hero__side .oo-tile__text{padding:14px 12px 16px;gap:8px}
.oo-hero__side .oo-tile__more{font-size:.64rem;letter-spacing:.14em}
.oo-hero__side .oo-tile__more::after{width:14px}}`,
    render: (d, c, id) => {
      c.rule(`.oo-b${id}{height:calc(${d.h}svh - var(--oo-offset))}`);
      c.ruleM(`.oo-b${id} .oo-hero__main{height:calc(${d.hm}svh - var(--oo-offset))}`);
      const m = d.main;
      return `<section class="oo-hero oo-b${id}" aria-label="${c.e(String(m.title).replace(/\*/g, ''))}">
<a class="oo-tile oo-hero__main" href="${c.href(m.href)}"${c.edit(id, 'main')}>${c.img(m.img, '(max-width:760px) 100vw, 57vw', true)}
<div class="oo-tile__text">${m.eyebrow ? `<span class="oo-eyebrow">${c.e(m.eyebrow)}</span>` : ''}<h1>${c.t(m.title)}</h1>${m.lead ? `<span class="oo-hero__lead">${c.t(m.lead)}</span>` : ''}${m.cta ? `<span><span class="oo-btn oo-btn--solid">${c.e(m.cta)}</span></span>` : ''}</div></a>

/* ctx: mode = 'preview' | 'export'; files: key -> {base, w, h} (eksport) */
function makeCtx(mode, files) {
  const rules = [], rulesM = []; let n = 0;
  const src = (key, size) => {
    if (mode === 'preview') return imgUrl(key);
    const f = files[key]; return f ? `${STATE.settings.prefix}${f.base}${size === 'm' ? '-m' : ''}.jpg` : '';
  };
  const srcset = key => {
    if (mode === 'preview') return '';
    const f = files[key]; if (!f) return '';
    return f.w > 800 ? ` srcset="${esc(src(key, 'm'))} 800w, ${esc(src(key))} ${Math.min(1600, f.w)}w"` : '';
  };
  return {
    mode, rules, rulesM,
    e: esc, t: rich,
    href: h => esc(h || '#'),
    edit: (id, sub) => mode === 'preview' ? ` data-edit="${id}${sub != null ? ':' + sub : ''}"` : '',
    rule: r => rules.push(r), ruleM: r => rulesM.push(r),
    img(im, sizes, eager = false, variant = 'fill') {
      if (!im || !im.key || !IMGS.has(im.key)) return '';
      const meta = IMGS.get(im.key), cls = 'oo-i' + (++n);
      if (variant !== 'plain') {
        rules.push(`.${cls}{object-position:${im.p[0]}% ${im.p[1]}%}`);
        if (im.pm) rulesM.push(`.${cls}{object-position:${im.pm[0]}% ${im.pm[1]}%}`);
      }
      const useSmall = variant === 'small' && mode === 'export';
      const main = useSmall ? src(im.key, files[im.key]?.w > 800 ? 'm' : '') : src(im.key);
      const dims = useSmall && meta.w > 800 ? ` width="800" height="${Math.round(meta.h * 800 / meta.w)}"` : ` width="${meta.w}" height="${meta.h}"`;
      const tag = `<img class="${variant === 'plain' ? '' : 'oo-fill '}${cls}" src="${esc(main)}"${useSmall ? '' : srcset(im.key)}${useSmall ? '' : ` sizes="${sizes}"`}${dims} alt="${esc(im.alt)}"${eager ? ' fetchpriority="high"' : ' loading="lazy"'}>`;
      if (im.km && IMGS.has(im.km)) {
        const mm = files?.[im.km];
        const ms = mode === 'preview' ? imgUrl(im.km) : (mm && mm.w > 800 ? `${src(im.km, 'm')} 800w, ${src(im.km)} ${Math.min(1600, mm.w)}w` : src(im.km));
        return `<picture><source media="(max-width:760px)" srcset="${esc(ms)}"${mode === 'export' && mm && mm.w > 800 ? ' sizes="100vw"' : ''}>${tag}</picture>`;
      }
      return tag;
    }
  };
}

function fontsLink(s) {
  const fam = f => f.replace(/ /g, '+');
  return `https://fonts.googleapis.com/css2?family=${fam(s.fontD)}:ital,wght@0,500;0,600;1,400;1,500&family=${fam(s.fontB)}:wght@400;500&display=swap`;
}

function renderSnippet(state, ctx) {
  const vis = state.blocks.filter(b => !b.hidden && TYPES[b.type]);
  const body = vis.map(b => `<!-- ${TYPES[b.type].label} -->\n` + TYPES[b.type].render(b.data, ctx, b.id)).join('\n\n');
  const types = [...new Set(vis.map(b => b.type))];
  const css = [baseCss(state.settings), ...types.map(t => TYPES[t].css), ctx.rules.join('\n'),
    ctx.rulesM.length ? `@media (max-width:760px){${ctx.rulesM.join('\n')}}` : ''].join('\n');
  const headerNote = ctx.mode === 'export' ? `<!--
  OAK&OATS — strona główna (wygenerowano w edytorze ${new Date().toLocaleString('pl-PL')})
  Sky-Shop → Wygląd → Strona główna → Obszar edytowalny → tryb „Źródło” → wklej całość.
  Zdjęcia: wgraj pliki z paczki do folderu, którego adres zaczyna się od: ${state.settings.prefix}
-->\n` : '';
  return `${headerNote}<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="${fontsLink(state.settings)}">
<style>
${css}
</style>
<div class="oo">
${body}
</div>`;
}

let STATE, SEL = null;
const HIST = [], FUT = [];
let lastSnap = '';
function snapshot() {
  const s = JSON.stringify(STATE);
  if (s === lastSnap) return;
  if (lastSnap) { HIST.push(lastSnap); if (HIST.length > 100) HIST.shift(); FUT.length = 0; }
  lastSnap = s; updUndo();
}
function updUndo() { $('#undo').disabled = !HIST.length; $('#redo').disabled = !FUT.length; }
function undo() { if (!HIST.length) return; FUT.push(lastSnap); lastSnap = HIST.pop(); STATE = JSON.parse(lastSnap); afterLoad(); }
function redo() { if (!FUT.length) return; HIST.push(lastSnap); lastSnap = FUT.pop(); STATE = JSON.parse(lastSnap); afterLoad(); }

let snapT, saveT;
function changed(structural = false) {
  schedulePreview();

const DB = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('oo-editor', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { try { const d = await this.open(); return await new Promise(r => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(undefined); }); } catch { return undefined; } },
  async set(k, v) { try { const d = await this.open(); await new Promise(r => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = r; t.onerror = r; }); return true; } catch { return false; } },
};

let prevT, frameScroll = 0;
function schedulePreview() { clearTimeout(prevT); prevT = setTimeout(renderPreview, 160); }
function renderPreview() {
  const f = $('#frame');
  try { frameScroll = f.contentWindow?.scrollY || frameScroll; } catch {}
  const ctx = makeCtx('preview');
  const html = `<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#fff}[data-edit]{cursor:pointer}[data-edit]:hover{outline:2px dashed rgba(196,149,47,.95);outline-offset:-3px}.oo-sel{outline:3px solid #c4952f!important;outline-offset:-3px}</style></head>
<body>${STATE.settings.mock ? MOCK : ''}${renderSnippet(STATE, ctx)}</body></html>`;
  f.srcdoc = html;
}
function wireFrame() {
  const f = $('#frame'); let doc;
  try { doc = f.contentDocument; } catch { return; }
  if (!doc) return;
  try { f.contentWindow.scrollTo(0, frameScroll); } catch {}
  doc.addEventListener('click', e => {
    const a = e.target.closest('a'); if (a) e.preventDefault();
    const t = e.target.closest('[data-edit]'); if (!t) return;
    const [id, sub] = t.dataset.edit.split(':');
    select(id, sub, true);
  }, true);

}
function highlight() {
  let doc; try { doc = $('#frame').contentDocument; } catch { return; }
  if (!doc) return;
  doc.querySelectorAll('.oo-sel').forEach(n => n.classList.remove('oo-sel'));
  if (!SEL) return;
  const n = doc.querySelector(`[data-edit="${SEL.id}${SEL.sub ? ':' + SEL.sub : ''}"]`) || doc.querySelector(`[data-edit="${SEL.id}"]`);
  if (n) n.classList.add('oo-sel');
}
function scrollFrameTo(id) {
  let doc; try { doc = $('#frame').contentDocument; } catch { return; }
  const n = doc?.querySelector(`[data-edit="${id}"]`) || doc?.querySelector(`[data-edit^="${id}:"]`);
  n?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const OPEN = new Set(); // id bloków / ścieżek list otwartych
const getK = (o, k) => o[k];
function select(id, sub, fromFrame = false) {
  SEL = { id, sub };
  OPEN.add(id);
  if (sub) { const parts = sub.split('.'); if (parts.length === 2) OPEN.add(id + ':' + sub); }
  renderPanel();
  const card = document.querySelector(`.card[data-id="${id}"]`);
  const target = (sub && card?.querySelector(`[data-path="${sub}"]`)) || card;
  if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash'); }
  if (fromFrame && matchMedia('(max-width:900px)').matches) setPane('edit');

function renderPanel() {

function blockCard(b, i) {
  const T = TYPES[b.type]; const open = OPEN.has(b.id);
  const card = el('div', { class: 'card' + (open ? ' is-open' : '') + (SEL?.id === b.id ? ' is-sel' : '') + (b.hidden ? ' is-hidden' : ''), 'data-id': b.id });

  card.append(el('div', { class: 'card__head', onclick: () => { if (open) { OPEN.delete(b.id); renderPanel(); } else select(b.id); } },
    el('span', { class: 'card__name' }, name, el('span', { class: 'card__type' }, `${T.label} · ${T.kind}`)),
    el('button', { class: 'ib', title: 'W górę', 'aria-label': 'Przesuń w górę', disabled: i === 0, onclick: stop(() => move(STATE.blocks, i, -1, true)) }, '↑'),
    el('button', { class: 'ib', title: 'W dół', 'aria-label': 'Przesuń w dół', disabled: i === STATE.blocks.length - 1, onclick: stop(() => move(STATE.blocks, i, 1, true)) }, '↓'),
    el('button', { class: 'ib', title: b.hidden ? 'Pokaż na stronie' : 'Ukryj na stronie', 'aria-label': b.hidden ? 'Pokaż' : 'Ukryj', onclick: stop(() => { b.hidden = !b.hidden; changed(true); }) }, b.hidden ? '◌' : '◉'),

    el('button', { class: 'ib', title: 'Usuń', 'aria-label': 'Usuń sekcję', onclick: stop(() => { if (card.dataset.confirm) { STATE.blocks.splice(i, 1); changed(true); toast('Usunięto sekcję. Cofnij: Ctrl+Z'); } else { card.dataset.confirm = 1; toast('Kliknij kosz jeszcze raz, żeby usunąć sekcję'); setTimeout(() => delete card.dataset.confirm, 2500); } }) }, '🗑')));
  if (open) {
    const body = el('div', { class: 'card__body' });
    buildFields(body, b.data, T.fields, b.id, '');

  }

function move(arr, i, d, structural) {
  const j = i + d; if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]]; changed(structural);
}

function buildFields(container, obj, fields, bid, prefix) {
  for (const f of fields) {
    const path = prefix ? prefix + '.' + f.k : f.k;
    let node;
    switch (f.t) {
      case 'text': node = textField(f.label, obj, f.k, f); break;
      case 'area': node = textField(f.label, obj, f.k, { ...f, area: true }); break;
      case 'select': node = selectField(f.label, obj, f.k, f.opts); break;
      case 'range': node = rangeField(f.label, obj, f.k, f.min, f.max, f.unit); break;
      case 'row': node = el('div', { class: 'row2' }); buildFields(node, obj, f.fields, bid, prefix); break;
      case 'img': node = imgField(f, obj, f.k); break;
      case 'group': node = el('div', { class: 'grpbox', 'data-path': path }, el('div', { class: 'gt' }, f.label)); buildFields(node, obj[f.k], f.fields, bid, path); break;
      case 'list': node = listField(f, obj, bid, path); break;
      case 'points': node = pointsField(f, obj, bid, path); break;
    }
    if (node) { if (!node.dataset.path && f.k) node.dataset.path = path; container.append(node); }
  }
}

function textField(label, obj, k, o = {}) {
  const id = 'f' + uid();
  const inp = o.area ? el('textarea', { id, rows: 3 }) : el('input', { id, type: 'text' });
  inp.value = obj[k] ?? '';
  inp.addEventListener('input', () => { obj[k] = inp.value; changed(); });
  return el('div', { class: 'f' }, el('label', { for: id }, label), inp, o.hint ? el('span', { class: 'hint' }, o.hint) : null);
}
function numField(label, obj, k, min, max) {
  const id = 'f' + uid(); const inp = el('input', { id, type: 'number', min, max, value: obj[k] });
  inp.addEventListener('input', () => { const v = +inp.value; if (!isNaN(v)) { obj[k] = v; changed(); } });
  return el('div', { class: 'f' }, el('label', { for: id }, label), inp);
}
function selectField(label, obj, k, opts) {
  const id = 'f' + uid(); const s = el('select', { id });
  opts.forEach(([v, l]) => { const o = el('option', { value: String(v) }, l); if (String(obj[k]) === String(v)) o.selected = true; s.append(o); });
  s.addEventListener('change', () => { const v = opts.find(([x]) => String(x) === s.value)[0]; obj[k] = v; changed(true); });
  return el('div', { class: 'f' }, el('label', { for: id }, label), s);
}

/* ============================================================
   Minimalny zapis ZIP (bez kompresji — JPG i tak jest skompresowany). Bez zewnętrznych bibliotek.
   ============================================================ */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
async function makeZip(entries) { // [{name, data: Blob|string}]
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)), dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate());
  for (const e of entries) {
    const data = typeof e.data === 'string' ? enc.encode(e.data) : new Uint8Array(await e.data.arrayBuffer());
    const name = enc.encode(e.name), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(h.buffer, name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dt, true); c.setUint16(14, dd, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(c.buffer, name);
    off += 30 + name.length + data.length;
  }
  const csize = central.reduce((a, x) => a + x.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, csize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}

function usedImages() {
  const out = new Map(); // key -> alt
  (function walk(o) {
    if (!o || typeof o !== 'object') return;
    if ('key' in o && Array.isArray(o.p)) { if (o.key && !out.has(o.key)) out.set(o.key, o.alt); if (o.km && !out.has(o.km)) out.set(o.km, (o.alt || '') + ' telefon'); return; }
    Object.values(o).forEach(walk);
  })(STATE.blocks.filter(b => !b.hidden));
  return out;
}
async function hashBlob(blob) {
  const b = new Uint8Array(await blob.arrayBuffer()); let h = 0x811c9dc5;
  for (let i = 0; i < b.length; i += 3) { h ^= b[i]; h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36).padStart(6, '0').slice(-6);
}
async function fileMap() {
  const files = {};
  for (const [key, alt] of usedImages()) {
    const m = IMGS.get(key); if (!m) continue;
    m.hash = m.hash || await hashBlob(m.blob);
    files[key] = { base: `oo-${slug(alt)}-${m.hash}`, w: m.w, h: m.h };
  }
  return files;
}
async function resized(blob, maxW) {
  const bmp = await createImageBitmap(blob);
  const s = Math.min(1, maxW / bmp.width);
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, c.width, c.height); bmp.close();
  return new Promise(r => c.toBlob(r, 'image/jpeg', maxW > 900 ? .82 : .78));
}
async function exportCode() { const files = await fileMap(); return { code: renderSnippet(STATE, makeCtx('export', files)), files }; }

const dlP = (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null);
async function saveFile(name, blob) {
  const d = await Promise.race([dlP, new Promise(r => setTimeout(() => r(null), 1500))]);
  if (d) {
    try { await d.save({ filename: name, data: blob }); return true; }
    catch (e) { if (e?.code === 'declined') { toast('Anulowano zapis pliku'); return false; } }
  }
  const a = el('a', { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); return true;
}
async function copyText(t, ta) {
  try { await navigator.clipboard.writeText(t); toast('Skopiowano kod. Wklej go w Sky-Shop w trybie „Źródło”.'); }
  catch { if (ta) { ta.focus(); ta.select(); } toast('Zaznaczyłem kod — naciśnij Ctrl+C (na Macu Cmd+C)'); }
}

    el('ol', { class: 'steps' },

    await saveUploads();
    STATE = j.state; afterLoad(); snapshot(); saveState(); toast('Wczytano projekt');
  } catch (err) { toast(err.message || 'Nie udało się wczytać projektu'); }
});

/* ============================================================
   Start
   ============================================================ */
function setPane(p) { $('#app').dataset.pane = p; $('#paneEdit').setAttribute('aria-pressed', p === 'edit'); $('#paneView').setAttribute('aria-pressed', p === 'view'); }
function afterLoad() {
  // napraw odwołania do zdjęć, których już nie ma
  (function walk(o) { if (!o || typeof o !== 'object') return; if ('key' in o && Array.isArray(o.p)) { if (o.key && !IMGS.has(o.key)) o.key = ''; if (o.km && !IMGS.has(o.km)) o.km = ''; return; } Object.values(o).forEach(walk); })(STATE.blocks);
  renderPanel(); renderPreview(); updUndo();
}
async function boot() {
  for (const [k, d] of Object.entries(DEFAULT_IMAGES)) await addImage(k, await dataToBlob(d));
  const ups = await DB.get('uploads');
  if (ups) for (const [k, b] of Object.entries(ups)) if (b instanceof Blob) await addImage(k, b);
  const saved = await DB.get('state');
  try { STATE = saved ? JSON.parse(saved) : defaultState(); if (!STATE.blocks) throw 0; } catch { STATE = defaultState(); }
  OPEN.add(STATE.blocks[0]?.id);
  lastSnap = JSON.stringify(STATE);
  afterLoad();
}

$('#frame').addEventListener('load', wireFrame);
$('#undo').addEventListener('click', undo);
$('#redo').addEventListener('click', redo);
$('#codeBtn').addEventListener('click', openCode);
$('#zipBtn').addEventListener('click', openExport);
$('#projBtn').addEventListener('click', openProject);
$('#paneEdit').addEventListener('click', () => setPane('edit'));
$('#paneView').addEventListener('click', () => { setPane('view'); renderPreview(); });
document.querySelectorAll('[data-dev]').forEach(b => b.addEventListener('click', () => {
  if (b.tagName !== 'BUTTON') return;
  $('#stage').dataset.dev = b.dataset.dev;
  document.querySelectorAll('button[data-dev]').forEach(x => x.setAttribute('aria-pressed', x === b));
  if (matchMedia('(max-width:900px)').matches) setPane('view');
}));
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
});
boot();
</script>
